<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷虎練唱台 直播歌詞</title>
<style>
  @font-face { font-family: "jf open huninn"; src: url("/static/fonts/jf-openhuninn-2.1.ttf") format("truetype"); font-display: block; }
  /* 直播用的歌詞畫面：背景透明，給 OBS「瀏覽器」來源使用。設定都在網址參數裡 */
  :root {
    --size: 56px; --fill: #f0a04a; --ink: #ffffff; --edge: rgba(0, 0, 0, .85);
    --font: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "標楷體", "Noto Serif TC", serif;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.bg-green { background: #00ff00; }
  body.bg-black { background: #000; }
  body.font-huninn { --font: "jf open huninn", "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif; }
  body.font-sans { --font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif; }
  .wrap {
    position: fixed; inset: 0; display: flex; flex-direction: column; padding: 4vh 4vw;
    box-sizing: border-box; gap: calc(var(--size) * .18);
  }
  .pos-bottom .wrap { justify-content: flex-end; }
  .pos-center .wrap { justify-content: center; }
  .pos-top .wrap { justify-content: flex-start; }
  .align-center .wrap { align-items: center; text-align: center; }
  .align-left .wrap { align-items: flex-start; text-align: left; }
  .ln {
    position: relative; font-family: var(--font); line-height: 1.3; white-space: nowrap; color: var(--ink);
    font-weight: 700;
    /* 八個方向的描邊＋外光暈，任何畫面上都看得清楚 */
    --e: max(2px, calc(var(--fs) * .055));
    text-shadow:
      var(--e) 0 0 var(--edge), calc(var(--e) * -1) 0 0 var(--edge), 0 var(--e) 0 var(--edge), 0 calc(var(--e) * -1) 0 var(--edge),
      calc(var(--e) * .7) calc(var(--e) * .7) 0 var(--edge), calc(var(--e) * -.7) calc(var(--e) * .7) 0 var(--edge),
      calc(var(--e) * .7) calc(var(--e) * -.7) 0 var(--edge), calc(var(--e) * -.7) calc(var(--e) * -.7) 0 var(--edge),
      0 0 calc(var(--e) * 3) rgba(0, 0, 0, .6);
    font-size: var(--fs);
  }
  .ln:empty { display: none; }
  .now { --fs: var(--size); }
  /* 用實色而不是半透明，綠幕去背時才不會透出綠色 */
  .side { --fs: calc(var(--size) * .62); color: #e2e2e2; }
  .prev { color: #a8a8a8; }
  .now .fill {
    position: absolute; left: 0; top: 0; color: var(--fill); white-space: nowrap;
    clip-path: inset(-50% calc(100% - var(--p, 0%)) -20% -5%);
  }
  .now.plain .fill { display: none; }
  rt { font-size: .45em; line-height: 1; }
  ruby { margin: 0 .06em; }
  .wrap.furi .ln { line-height: 1.95; }
  .now.plain .base { color: var(--fill); }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const NLINES = [1, 2, 3, 5].includes(+Q.get("lines")) ? +Q.get("lines") : 2;
const SIZE = Math.min(200, Math.max(16, +Q.get("size") || 56));
const hex = s => /^[0-9a-fA-F]{6}$/.test(s || "") ? "#" + s : null;
document.documentElement.style.setProperty("--size", SIZE + "px");
if (hex(Q.get("color"))) document.documentElement.style.setProperty("--fill", hex(Q.get("color")));
if (hex(Q.get("ink"))) document.documentElement.style.setProperty("--ink", hex(Q.get("ink")));
document.body.classList.add("pos-" + (["top", "center", "bottom"].includes(Q.get("pos")) ? Q.get("pos") : "bottom"));
document.body.classList.add("align-" + (Q.get("align") === "left" ? "left" : "center"));
if (["green", "black"].includes(Q.get("bg"))) document.body.classList.add("bg-" + Q.get("bg"));
if (["sans", "huninn"].includes(Q.get("font"))) document.body.classList.add("font-" + Q.get("font"));

// 依行數排版：1 行＝正在唱；2 行＝正在唱＋下一句；3 行＝上一句＋正在唱＋下一句；5 行＝上一句＋正在唱＋後三句
const LAYOUT = { 1: [0], 2: [0, 1], 3: [-1, 0, 1], 5: [-1, 0, 1, 2, 3] }[NLINES];
const wrap = document.getElementById("wrap");
const rows = LAYOUT.map(off => {
  const el = document.createElement("div");
  el.className = "ln " + (off === 0 ? "now" : off < 0 ? "side prev" : "side");
  if (off === 0) el.innerHTML = '<span class="base"></span><span class="fill" aria-hidden="true"></span>';
  wrap.appendChild(el);
  return { off, el, text: null };
});

const ST = { ver: null, lines: [], sid: null, color: true, base: { t: 0, at: 0, playing: false, rate: 1 } };
function nowT() {
  const b = ST.base;
  return b.playing ? b.t + (performance.now() - b.at) / 1000 * b.rate : b.t;
}
async function poll() {
  try {
    const r = await fetch("/api/overlay" + (ST.ver != null ? "?ver=" + ST.ver : ""), { cache: "no-store" });
    const d = await r.json();
    if (d.lines) { ST.lines = d.lines; ST.ver = d.ver; rows.forEach(r => (r.text = null)); wrap.classList.toggle("furi", d.lines.some(l => l.r)); }
    ST.sid = d.sid; ST.color = d.color;
    const pred = nowT(), b = ST.base;
    // 播放中只在誤差夠大時才校正，避免上色抖動
    if (b.playing !== d.playing || b.rate !== d.rate || Math.abs(pred - d.t) > 0.12) {
      ST.base = { t: d.t, at: performance.now(), playing: d.playing, rate: d.rate };
    }
  } catch {
    ST.sid = null;   // 練唱台關掉了：畫面清空
  }
  setTimeout(poll, 250);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function rubyHTML(r) { return r.map(([b, t]) => (t ? `<ruby>${esc(b)}<rt>${esc(t)}</rt></ruby>` : esc(b))).join(""); }

function fit(el, fs) {
  // 太長的句子自動縮小，不超出畫面
  el.style.fontSize = fs + "px";
  const max = wrap.clientWidth * 0.92;
  if (el.scrollWidth > max) el.style.fontSize = Math.max(12, fs * max / el.scrollWidth) + "px";
}

function render() {
  const L = ST.sid ? ST.lines : [];
  const t = nowT();
  let i = -1;
  for (let k = 0; k < L.length; k++) { if (L[k].t <= t + 0.05) i = k; else break; }
  for (const r of rows) {
    const l = L[i + r.off] || null;
    // 還沒到第一句時，「正在唱」那行先空著，下一句顯示第一句
    const tx = l && !(r.off < 0 && i + r.off < 0) ? l.text : "";
    if (r.text !== tx) {
      r.text = tx;
      const h = l && l.r && tx ? rubyHTML(l.r) : null;
      if (r.off === 0) { for (const c of [r.el.querySelector(".base"), r.el.querySelector(".fill")]) h ? (c.innerHTML = h) : (c.textContent = tx); }
      else if (h) r.el.innerHTML = h;
      else r.el.textContent = tx;
      fit(r.el, r.off === 0 ? SIZE : SIZE * 0.62);
    }
    if (r.off === 0) {
      r.el.classList.toggle("plain", !ST.color);
      let p = 0;
      if (l && i >= 0) {
        p = Math.min(1, Math.max(0, (t - l.t) / Math.max(0.3, (l.end || l.t + 3) - l.t)));
        const c = l.c || [], n = c.length;
        if (n) {   // 有逐字時間時，跟著每個字上色
          let k = 0; while (k < n && c[k] <= t) k++;
          const nextT = k < n ? c[k] : Math.max(l.end || 0, (c[n - 1] || l.t) + 0.3);
          const prevT = k > 0 ? c[k - 1] : l.t;
          p = k === 0 ? 0 : Math.min(1, Math.max(0, (k - 1 + Math.min(1, Math.max(0, (t - prevT) / Math.max(0.05, nextT - prevT)))) / n));
        }
      }
      r.el.style.setProperty("--p", (p * 100).toFixed(1) + "%");
    }
  }
  requestAnimationFrame(render);
}
poll();
requestAnimationFrame(render);
</script>
</body>
</html>
